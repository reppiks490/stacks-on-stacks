name: Everbloom principal player save-health UI
on:
  push:
    paths:
      - 'scripts/game.gd'
      - 'scripts/hud.gd'
      - 'scripts/principal_save_health_panel.gd'
      - 'scripts/principal_save_health_panel_acceptance.gd'
      - 'docs/PRINCIPAL_P12_SAVE_HEALTH_ACCESSIBILITY.md'
      - '.github/workflows/everbloom-principal-save-health-ui.yml'
permissions:
  contents: read
jobs:
  native-save-health-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      XDG_DATA_HOME: /tmp/everbloom-principal-save-health-player-ui
    steps:
      - uses: actions/checkout@v4
      - name: Download checksum-pinned official Godot 4.7.2
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/godot.zip' | sha256sum --check
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.7.2-stable_linux.x86_64
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --version
      - name: Native editor import and GDScript parsing
        run: |
          set -euo pipefail
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --editor --import --quit 2>&1 | tee principal_ui_import.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|ERROR: Failed loading|ERROR: Failed to load|ERROR: Cannot open' principal_ui_import.log; then exit 1; fi
      - name: Native assembled-game player UI acceptance
        run: |
          set -euo pipefail
          mkdir -p "$XDG_DATA_HOME"
          timeout 45s /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://scripts/principal_save_health_panel_acceptance.gd 2>&1 | tee principal_ui_native.log
          grep -Eq '^PRINCIPAL SAVE UI: [0-9]+ assertions, 0 failures$' principal_ui_native.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|PRINCIPAL SAVE UI FAIL:' principal_ui_native.log; then exit 1; fi
      - name: Archive exact-head evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: everbloom-principal-save-health-ui-${{ github.sha }}
          path: |
            principal_ui_import.log
            principal_ui_native.log
          if-no-files-found: ignore
          retention-days: 14
