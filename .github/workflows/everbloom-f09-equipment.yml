name: Everbloom F09 finite equipment native acceptance
on:
  push:
    branches:
      - 'game/everbloom-farming-f09-tools-20261102'
    paths:
      - 'scripts/farm_equipment_progression.gd'
      - 'scripts/farm_equipment_acceptance.gd'
      - 'docs/FARM_F09_EQUIPMENT.md'
      - '.github/workflows/everbloom-f09-equipment.yml'
permissions:
  contents: read
jobs:
  equipment-native:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Download SHA-256 pinned official Godot 4.7.2
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/godot.zip' | sha256sum --check
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.7.2-stable_linux.x86_64
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --version
      - name: Native import and GDScript parse
        run: |
          set -euo pipefail
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --editor --import --quit 2>&1 | tee f09_import.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|ERROR: Failed loading|ERROR: Failed to load|ERROR: Cannot open' f09_import.log; then exit 1; fi
      - name: Native two-year equipment and hostile save acceptance
        run: |
          set -euo pipefail
          timeout 90s /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://scripts/farm_equipment_acceptance.gd 2>&1 | tee f09_acceptance.log
          grep -Eq '^EVERBLOOM F09 EQUIPMENT NATIVE: [0-9]+ assertions, 0 failures$' f09_acceptance.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|F09 EQUIPMENT FAILED:|ERROR: Failed loading|ERROR: Failed to load|ERROR: Cannot open' f09_acceptance.log; then exit 1; fi
      - name: Preserve exact-head native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: everbloom-f09-equipment-${{ github.sha }}
          path: |
            f09_import.log
            f09_acceptance.log
          if-no-files-found: ignore
          retention-days: 14
