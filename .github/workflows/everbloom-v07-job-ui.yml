name: Everbloom V07 native town-work input acceptance
on:
  push:
    paths:
      - 'scripts/village.gd'
      - 'scripts/village_job_panel.gd'
      - 'scripts/village_job_panel_acceptance.gd'
      - 'docs/VILLAGE_SYSTEMS.md'
      - '.github/workflows/everbloom-v07-job-ui.yml'
permissions:
  contents: read
jobs:
  village-work-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      XDG_DATA_HOME: /tmp/everbloom-v07-work-ui
    steps:
      - uses: actions/checkout@v4
      - name: Download checksum-pinned official Godot 4.7.2
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/godot.zip' | sha256sum --check
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.7.2-stable_linux.x86_64
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --version
      - name: Native Godot import and parse
        run: |
          set -euo pipefail
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --editor --import --quit 2>&1 | tee v07_import.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|ERROR: Failed loading|ERROR: Failed to load|ERROR: Cannot open' v07_import.log; then exit 1; fi
      - name: Native assembled-game button controller keyboard save acceptance
        run: |
          set -euo pipefail
          timeout 75s /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://scripts/village_job_panel_acceptance.gd 2>&1 | tee v07_native.log
          grep -Eq '^EVERBLOOM V07 WORK UI NATIVE: [0-9]+ assertions, 0 failures$' v07_native.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|ERROR: Failed loading|ERROR: Failed to load|ERROR: Cannot open|V07 WORK UI FAILED:' v07_native.log; then exit 1; fi
      - name: Archive native exact-commit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: everbloom-v07-work-ui-${{ github.sha }}
          path: |
            v07_import.log
            v07_native.log
          if-no-files-found: ignore
