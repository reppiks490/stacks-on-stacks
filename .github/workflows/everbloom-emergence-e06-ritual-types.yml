name: Everbloom E071-E080 optional ritual design-state validation
on:
  push:
    paths:
      - 'docs/innovation/emergence/typed_state/ritual_071_080.json'
      - 'docs/innovation/emergence/typed_state/validate_ritual_071_080.py'
      - 'docs/innovation/emergence/typed_state/RITUAL_STATE_HANDOFF.md'
      - '.github/workflows/everbloom-emergence-e06-ritual-types.yml'
permissions:
  contents: read
jobs:
  ritual-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify source SHA and exact checked-out HEAD
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git status --porcelain
          echo "RITUAL_CONTRACT_HEAD=$GITHUB_SHA"
      - name: Adversarial E071-E080 design-only typed state validation
        run: |
          set -euo pipefail
          python docs/innovation/emergence/typed_state/validate_ritual_071_080.py --self-test
