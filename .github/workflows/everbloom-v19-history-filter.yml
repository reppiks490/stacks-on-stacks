name: Everbloom V19 bilingual history filter native acceptance
on:
  push:
    paths:
      - 'scripts/village_social_journal.gd'
      - 'scripts/village_history_filter_acceptance.gd'
      - 'docs/VILLAGE_V19_HISTORY_LANGUAGE_FILTER.md'
      - '.github/workflows/everbloom-v19-history-filter.yml'
permissions:
  contents: read
jobs:
  village-history-filter:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Download checksum-pinned official Godot 4.7.2
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/godot.zip' | sha256sum --check
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.7.2-stable_linux.x86_64
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --version
      - name: Native import and GDScript parse
        run: |
          set -euo pipefail
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --editor --import --quit 2>&1 | tee v19_history_filter_import.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|ERROR: Failed loading|ERROR: Failed to load|ERROR: Cannot open' v19_history_filter_import.log; then exit 1; fi
      - name: Native V19 bilingual authentic history filter acceptance
        run: |
          set -euo pipefail
          timeout 60s /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://scripts/village_history_filter_acceptance.gd 2>&1 | tee v19_history_filter_native.log
          grep -Eq '^EVERBLOOM V19 HISTORY FILTER NATIVE: [0-9]+ assertions, 0 failures$' v19_history_filter_native.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|ERROR: Failed loading|ERROR: Failed to load|ERROR: Cannot open|V19 HISTORY FILTER FAILED:' v19_history_filter_native.log; then exit 1; fi
      - name: Preserve exact-commit V19 history filter evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: everbloom-v19-history-filter-${{ github.sha }}
          path: |
            v19_history_filter_import.log
            v19_history_filter_native.log
          if-no-files-found: ignore
          retention-days: 14
