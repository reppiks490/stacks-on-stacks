name: Everbloom farming native acceptance
on:
  push:
    paths:
      - 'scripts/farm.gd'
      - 'scripts/farm_hydrology.gd'
      - 'scripts/animals.gd'
      - 'scripts/farming_test_host.gd'
      - 'scripts/farming_acceptance.gd'
      - 'data/crops.json'
      - '.github/workflows/everbloom-farming-acceptance.yml'
permissions:
  contents: read
jobs:
  farm-native:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Download checksum-pinned official Godot 4.7.2
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/godot.zip' | sha256sum --check
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.7.2-stable_linux.x86_64
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --version
      - name: Native import
        run: |
          set -euo pipefail
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --editor --import --quit 2>&1 | tee farm_import.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|ERROR: Failed loading|ERROR: Failed to load|ERROR: Cannot open' farm_import.log; then exit 1; fi
      - name: Native 56-day farming and husbandry acceptance
        run: |
          set -euo pipefail
          timeout 60s /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://scripts/farming_acceptance.gd 2>&1 | tee farm_acceptance.log
          grep -q 'EVERBLOOM FARM NATIVE ACCEPTANCE:' farm_acceptance.log
          grep -q '0 failures' farm_acceptance.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|ERROR: Failed loading|ERROR: Failed to load|ERROR: Cannot open|FARM ACCEPTANCE FAILED:' farm_acceptance.log; then exit 1; fi
      - name: Save diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: everbloom-farming-native-${{ github.sha }}
          path: |
            farm_import.log
            farm_acceptance.log
          if-no-files-found: ignore
          retention-days: 14
