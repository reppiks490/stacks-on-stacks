name: Everbloom F01 native soil ledger acceptance
on:
  push:
    branches:
      - game/everbloom-farming-f01-soil-ledger-20261102
    paths:
      - 'scripts/farm_soil_ledger.gd'
      - 'scripts/farm_soil_ledger_acceptance.gd'
      - 'docs/FARM_F01_SOIL_LEDGER.md'
      - '.github/workflows/everbloom-f01-soil-ledger.yml'
permissions:
  contents: read
jobs:
  f01-native:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Download checksum-pinned official Godot 4.7.2
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/godot.zip' | sha256sum --check
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.7.2-stable_linux.x86_64
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --version
      - name: Native import and parse
        run: |
          set -euo pipefail
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --editor --import --quit 2>&1 | tee f01_import.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|ERROR: Failed loading|ERROR: Failed to load|ERROR: Cannot open' f01_import.log; then exit 1; fi
      - name: Native two-year deterministic conservation acceptance
        run: |
          set -euo pipefail
          timeout 90s /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://scripts/farm_soil_ledger_acceptance.gd 2>&1 | tee f01_acceptance.log
          grep -q 'EVERBLOOM F01 SOIL NATIVE ACCEPTANCE:' f01_acceptance.log
          grep -q '0 failures' f01_acceptance.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|F01 SOIL ACCEPTANCE FAILED:' f01_acceptance.log; then exit 1; fi
      - name: Preserve exact-SHA diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: everbloom-f01-soil-${{ github.sha }}
          path: |
            f01_import.log
            f01_acceptance.log
          if-no-files-found: ignore
          retention-days: 14
