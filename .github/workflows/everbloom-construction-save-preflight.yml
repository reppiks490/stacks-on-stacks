name: Everbloom Construction B13 Native Save Boundary
on:
  push:
    branches:
      - game/everbloom-construction-b13-save-preflight-20261102
permissions:
  contents: read
jobs:
  construction-save-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact source checkout
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "EXACT_SHA=$GITHUB_SHA"
      - name: Download checksum-pinned official Godot 4.7.2
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/godot.zip' | sha256sum --check
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.7.2-stable_linux.x86_64
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --version
      - name: Native editor import and script parse
        run: |
          set -euo pipefail
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --editor --import --quit 2>&1 | tee construction_import.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|ERROR: Failed loading|ERROR: Failed to load' construction_import.log; then exit 1; fi
      - name: Actual assembled-game save-extension characterization
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/everbloom-b13-isolated
        run: |
          set -euo pipefail
          mkdir -p "$XDG_DATA_HOME"
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://docs/innovation/construction/save_preflight/native_acceptance.gd 2>&1 | tee construction_save_preflight.log
          grep -q 'CONSTRUCTION PREFLIGHT CHARACTERIZATION PASS' construction_save_preflight.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|CONSTRUCTION PREFLIGHT ASSERTION FAIL:|CONSTRUCTION PREFLIGHT FAIL:' construction_save_preflight.log; then exit 1; fi
      - name: Preserve exact-commit native diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: construction-save-preflight-${{ github.sha }}
          path: |
            construction_import.log
            construction_save_preflight.log
          if-no-files-found: ignore
          retention-days: 14
