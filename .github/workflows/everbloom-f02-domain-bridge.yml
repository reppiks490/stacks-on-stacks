name: Everbloom F02 combined farm-water domain bridge native acceptance
on:
  push:
    paths:
      - 'scripts/farm.gd'
      - 'scripts/farming_acceptance.gd'
      - 'scripts/farm_hydrology.gd'
      - 'scripts/farm_water_network.gd'
      - 'scripts/farm_water_network_acceptance.gd'
      - 'scripts/farm_f02_bridge_acceptance.gd'
      - 'docs/FARM_HYDROLOGY.md'
      - 'docs/FARM_WATER_NETWORK.md'
      - 'docs/FARM_F02_DOMAIN_BRIDGE.md'
      - '.github/workflows/everbloom-f02-domain-bridge.yml'
permissions:
  contents: read
jobs:
  farm-water-bridge-native:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - name: Download and checksum-verify official Godot 4.7.2
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/godot.zip' | sha256sum --check
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.7.2-stable_linux.x86_64
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --version
      - name: Native project import and parse
        run: |
          set -euo pipefail
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --editor --import --quit 2>&1 | tee f02_import.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|ERROR: Failed loading|ERROR: Failed to load|ERROR: Cannot open' f02_import.log; then exit 1; fi
      - name: Existing real farm and animal regression
        run: |
          set -euo pipefail
          timeout 60s /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://scripts/farming_acceptance.gd 2>&1 | tee f02_farm.log
          grep -Eq '^EVERBLOOM FARM NATIVE ACCEPTANCE: [0-9]+ assertions, 0 failures$' f02_farm.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|FARM ACCEPTANCE FAILED:' f02_farm.log; then exit 1; fi
      - name: Finite reservoir conservation regression
        run: |
          set -euo pipefail
          timeout 60s /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://scripts/farm_water_network_acceptance.gd 2>&1 | tee f02_network.log
          grep -Eq '^EVERBLOOM FARM WATER NETWORK NATIVE: [0-9]+ assertions, 0 failures$' f02_network.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|FARM WATER NETWORK FAILED:' f02_network.log; then exit 1; fi
      - name: Real water-tool rollback and 112-day thirty-bed catchment
        run: |
          set -euo pipefail
          timeout 60s /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://scripts/farm_f02_bridge_acceptance.gd 2>&1 | tee f02_bridge.log
          grep -Eq '^EVERBLOOM F02 BRIDGE NATIVE: [0-9]+ assertions, 0 failures$' f02_bridge.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|F02 BRIDGE FAILED:' f02_bridge.log; then exit 1; fi
      - name: Retain exact-SHA native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: everbloom-f02-bridge-${{ github.sha }}
          path: |
            f02_import.log
            f02_farm.log
            f02_network.log
            f02_bridge.log
          if-no-files-found: ignore
          retention-days: 14
