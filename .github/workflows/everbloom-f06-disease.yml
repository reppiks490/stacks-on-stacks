name: Everbloom F06 plant disease native acceptance
on:
  push:
    branches:
      - 'game/everbloom-farming-f06-disease-20261102'
    paths:
      - 'scripts/farm_disease_ecology.gd'
      - 'scripts/farm_disease_ecology_acceptance.gd'
      - 'docs/FARM_F06_DISEASE_ECOLOGY.md'
      - '.github/workflows/everbloom-f06-disease.yml'
permissions:
  contents: read
jobs:
  disease-native:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Download SHA-256 pinned official Godot 4.7.2
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/godot.zip' | sha256sum --check
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.7.2-stable_linux.x86_64
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --version
      - name: Native import and GDScript parse
        run: |
          set -euo pipefail
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --editor --import --quit 2>&1 | tee f06_import.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|ERROR: Failed loading|ERROR: Failed to load|ERROR: Cannot open' f06_import.log; then exit 1; fi
      - name: Native two-year disease spread, treatment and hostile save acceptance
        run: |
          set -euo pipefail
          timeout 60s /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://scripts/farm_disease_ecology_acceptance.gd 2>&1 | tee f06_acceptance.log
          grep -Eq '^EVERBLOOM F06 DISEASE NATIVE: [0-9]+ assertions, 0 failures$' f06_acceptance.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|F06 DISEASE FAILED:|ERROR: Failed loading|ERROR: Failed to load|ERROR: Cannot open' f06_acceptance.log; then exit 1; fi
      - name: Preserve exact-head native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: everbloom-f06-disease-${{ github.sha }}
          path: |
            f06_import.log
            f06_acceptance.log
          if-no-files-found: ignore
          retention-days: 14
