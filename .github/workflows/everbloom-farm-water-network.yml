name: Everbloom F02 finite-water native acceptance
on:
  push:
    paths:
      - 'scripts/farm_water_network.gd'
      - 'scripts/farm_water_network_acceptance.gd'
      - 'docs/FARM_WATER_NETWORK.md'
      - '.github/workflows/everbloom-farm-water-network.yml'
permissions:
  contents: read
jobs:
  water-network-native:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Download checksum-pinned official Godot 4.7.2
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/godot.zip' | sha256sum --check
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.7.2-stable_linux.x86_64
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --version
      - name: Native project import and GDScript parse
        run: |
          set -euo pipefail
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --editor --import --quit 2>&1 | tee farm_water_import.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|ERROR: Failed loading|ERROR: Failed to load|ERROR: Cannot open' farm_water_import.log; then exit 1; fi
      - name: Native two-year finite-water conservation acceptance
        run: |
          set -euo pipefail
          timeout 60s /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://scripts/farm_water_network_acceptance.gd 2>&1 | tee farm_water_native.log
          grep -Eq '^EVERBLOOM FARM WATER NETWORK NATIVE: [0-9]+ assertions, 0 failures$' farm_water_native.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|ERROR: Failed loading|ERROR: Failed to load|ERROR: Cannot open|FARM WATER NETWORK FAILED:' farm_water_native.log; then exit 1; fi
      - name: Preserve native water ledger diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: everbloom-f02-water-native-${{ github.sha }}
          path: |
            farm_water_import.log
            farm_water_native.log
          if-no-files-found: ignore
          retention-days: 14
