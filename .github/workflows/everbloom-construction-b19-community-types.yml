name: EVERBLOOM Construction B19 community typed-state design QA
on:
  push:
    paths:
      - 'docs/innovation/construction/typed_state/community_081_090.json'
      - 'docs/innovation/construction/typed_state/validate_community_081_090.py'
      - 'docs/innovation/construction/typed_state/COMMUNITY_STATE_HANDOFF.md'
      - '.github/workflows/everbloom-construction-b19-community-types.yml'
permissions:
  contents: read
jobs:
  community-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact checked-out HEAD
        run: |
          echo "COMMUNITY_CONTRACT_HEAD=$(git rev-parse HEAD)"
          echo "GITHUB_SHA=$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Compile validator
        run: python -m py_compile docs/innovation/construction/typed_state/validate_community_081_090.py
      - name: Validate B081-B090 typed states and hostile mutations
        run: python docs/innovation/construction/typed_state/validate_community_081_090.py
