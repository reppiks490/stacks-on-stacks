name: Everbloom principal native save-integrity acceptance
on:
  push:
    paths:
      - 'scripts/save_service.gd'
      - 'scripts/principal_save_acceptance.gd'
      - '.github/workflows/everbloom-principal-save-integrity.yml'
permissions:
  contents: read
jobs:
  save-integrity-native:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Download checksum-pinned official Godot 4.7.2
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/godot.zip' | sha256sum --check
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.7.2-stable_linux.x86_64
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --version
      - name: Native editor import and GDScript parsing
        run: |
          set -euo pipefail
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --editor --import --quit 2>&1 | tee principal_save_import.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|ERROR: Failed loading|ERROR: Failed to load|ERROR: Cannot open' principal_save_import.log; then exit 1; fi
      - name: Native adversarial save-payload acceptance
        run: |
          set -euo pipefail
          timeout 45s /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://scripts/principal_save_acceptance.gd 2>&1 | tee principal_save_contract.log
          grep -q 'PRINCIPAL SAVE VALIDATION: 24 assertions, 0 failures' principal_save_contract.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|PRINCIPAL SAVE VALIDATION FAIL:' principal_save_contract.log; then exit 1; fi
      - name: Archive principal native diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: everbloom-principal-save-integrity-${{ github.sha }}
          path: |
            principal_save_import.log
            principal_save_contract.log
          if-no-files-found: ignore
          retention-days: 14
