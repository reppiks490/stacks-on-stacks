name: EVERBLOOM Construction B19 household typed-state design QA
on:
  push:
    paths:
      - 'docs/innovation/construction/typed_state/household_071_080.json'
      - 'docs/innovation/construction/typed_state/validate_household_071_080.py'
      - 'docs/innovation/construction/typed_state/HOUSEHOLD_STATE_HANDOFF.md'
      - '.github/workflows/everbloom-construction-b19-household-types.yml'
permissions:
  contents: read
jobs:
  household-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact checked-out commit receipt
        run: |
          echo "HOUSEHOLD_CONTRACT_HEAD=$(git rev-parse HEAD)"
          echo "GITHUB_SHA=$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Compile validator (no Godot gameplay claim)
        run: python -m py_compile docs/innovation/construction/typed_state/validate_household_071_080.py
      - name: Validate B071-B080 nested typed states and hostile mutations
        run: python docs/innovation/construction/typed_state/validate_household_071_080.py
