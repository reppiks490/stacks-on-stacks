name: Everbloom V19 native social journal acceptance
on:
  push:
    paths:
      - 'scripts/village.gd'
      - 'scripts/village_social_journal.gd'
      - 'scripts/village_social_journal_acceptance.gd'
      - 'docs/VILLAGE_SYSTEMS.md'
      - '.github/workflows/everbloom-village-journal.yml'
permissions:
  contents: read
jobs:
  village-journal:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Download checksum-pinned official Godot 4.7.2
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/godot.zip' | sha256sum --check
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.7.2-stable_linux.x86_64
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --version
      - name: Native import and GDScript parse
        run: |
          set -euo pipefail
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --editor --import --quit 2>&1 | tee village_journal_import.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|ERROR: Failed loading|ERROR: Failed to load|ERROR: Cannot open' village_journal_import.log; then exit 1; fi
      - name: Native V19 UI and social memory acceptance
        run: |
          set -euo pipefail
          timeout 60s /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://scripts/village_social_journal_acceptance.gd 2>&1 | tee village_journal_native.log
          grep -Eq '^EVERBLOOM VILLAGE JOURNAL NATIVE: [0-9]+ assertions, 0 failures$' village_journal_native.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|ERROR: Failed loading|ERROR: Failed to load|ERROR: Cannot open|VILLAGE JOURNAL FAILED:' village_journal_native.log; then exit 1; fi
      - name: Preserve exact-commit V19 native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: everbloom-village-journal-${{ github.sha }}
          path: |
            village_journal_import.log
            village_journal_native.log
          if-no-files-found: ignore
          retention-days: 14
