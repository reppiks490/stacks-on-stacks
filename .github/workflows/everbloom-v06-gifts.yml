name: Everbloom V06 native explicit gift choice acceptance
on:
  push:
    paths:
      - 'scripts/village.gd'
      - 'scripts/village_gift_panel.gd'
      - 'scripts/village_gift_panel_acceptance.gd'
      - 'docs/VILLAGE_V06_EXPLICIT_GIFTS.md'
      - '.github/workflows/everbloom-v06-gifts.yml'
permissions:
  contents: read
jobs:
  gift-native:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      XDG_DATA_HOME: /tmp/everbloom-v06-gifts
    steps:
      - uses: actions/checkout@v4
      - name: Download checksum-pinned official Godot 4.7.2
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/godot.zip' | sha256sum --check
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.7.2-stable_linux.x86_64
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --version
      - name: Native Godot import and GDScript parse
        run: |
          set -euo pipefail
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --editor --import --quit 2>&1 | tee v06_import.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|ERROR: Failed loading|ERROR: Failed to load|ERROR: Cannot open' v06_import.log; then exit 1; fi
      - name: Assembled-game two-year explicit gift regression
        run: |
          set -euo pipefail
          timeout 75s /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://scripts/village_gift_panel_acceptance.gd 2>&1 | tee v06_native.log
          grep -Eq '^EVERBLOOM V06 GIFT NATIVE: [0-9]+ assertions, 0 failures$' v06_native.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|ERROR: Failed loading|ERROR: Failed to load|ERROR: Cannot open|V06 GIFT FAILED:' v06_native.log; then exit 1; fi
      - name: Preserve exact-head native diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: everbloom-v06-gifts-${{ github.sha }}
          path: |
            v06_import.log
            v06_native.log
          if-no-files-found: ignore
          retention-days: 14
