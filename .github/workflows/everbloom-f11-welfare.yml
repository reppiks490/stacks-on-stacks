name: Everbloom F11 native animal welfare acceptance
on:
  push:
    paths:
      - 'scripts/farm_animal_welfare.gd'
      - 'scripts/farm_welfare_acceptance.gd'
      - 'docs/FARM_F11_ANIMAL_WELFARE.md'
      - '.github/workflows/everbloom-f11-welfare.yml'
permissions:
  contents: read
jobs:
  welfare-native:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Download checksum-pinned official Godot 4.7.2
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/godot.zip' | sha256sum --check
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.7.2-stable_linux.x86_64
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --version
      - name: Native Godot import and GDScript parse
        run: |
          set -euo pipefail
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --editor --import --quit 2>&1 | tee f11_import.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|ERROR: Failed loading|ERROR: Failed to load|ERROR: Cannot open' f11_import.log; then exit 1; fi
      - name: Native two-year F11 welfare acceptance
        run: |
          set -euo pipefail
          timeout 90s /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://scripts/farm_welfare_acceptance.gd 2>&1 | tee f11_acceptance.log
          grep -q 'F11 WELFARE NATIVE ACCEPTANCE:' f11_acceptance.log
          grep -q '0 failures' f11_acceptance.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|F11 WELFARE FAILED:|ERROR: Failed loading|ERROR: Failed to load|ERROR: Cannot open' f11_acceptance.log; then exit 1; fi
      - name: Preserve native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: everbloom-f11-native-${{ github.sha }}
          path: |
            f11_import.log
            f11_acceptance.log
          if-no-files-found: ignore
          retention-days: 14
