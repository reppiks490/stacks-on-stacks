name: EVERBLOOM phase-A cross-loop catalog and authority audit
on:
  push:
    paths:
      - 'docs/innovation/construction/snapshots/**'
      - 'docs/innovation/construction/PHASEA_CROSS_LOOP_CONTRACT.json'
      - 'docs/innovation/construction/validate_phaseA_joint.py'
      - '.github/workflows/everbloom-phaseA-joint-audit.yml'
permissions:
  contents: read
jobs:
  phase-a-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate exact pinned 20-concept sources and eight cross-domain boundaries
        run: |
          set -euo pipefail
          python3 docs/innovation/construction/validate_phaseA_joint.py --self-test
      - name: Verify no implementation authorization or early engine migration
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("docs/innovation/construction/PHASEA_CROSS_LOOP_CONTRACT.json")
          c = json.loads(p.read_text(encoding="utf-8"))
          assert c["status"] == "candidate_pending_principal_acceptance"
          assert c["implementation_gate"] == 220
          assert c["engine"] == "Godot 4.x"
          assert all(x["approval"] == "pending_principal_review" for x in c["overlaps"])
          print("INNOVATION GATES: phase A pending Principal review; phases B and C blocked.")
          PY
