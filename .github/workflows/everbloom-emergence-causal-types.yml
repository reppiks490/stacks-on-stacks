name: Everbloom Emergence causal typed-state design audit
on:
  push:
    branches:
      - game/everbloom-emergence-e03-typed-state-20261102
    paths:
      - 'docs/innovation/emergence/typed_state/**'
      - '.github/workflows/everbloom-emergence-causal-types.yml'
permissions:
  contents: read
jobs:
  validate-causal-design:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate concrete types and reject hostile design states
        run: python docs/innovation/emergence/typed_state/validate_causal_011_020.py --self-test
