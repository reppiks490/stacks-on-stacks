name: Everbloom Python and native Godot source verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate original project data, references and provenance
        run: |
          python tools/validate_project.py
          python -m unittest discover -s tests -v
      - name: Download and authenticate official Godot 4.7.2 binary
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/godot.zip' | sha256sum --check
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.7.2-stable_linux.x86_64
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --version
      - name: Native Godot import and GDScript parse
        run: |
          set -euo pipefail
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --editor --import --quit 2>&1 | tee godot_import.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|ERROR: Failed loading|ERROR: Failed to load|ERROR: Cannot open' godot_import.log; then exit 1; fi
      - name: Native headless scene smoke (120 frames)
        run: |
          set -euo pipefail
          timeout 40s /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --quit-after 120 2>&1 | tee godot_smoke.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|ERROR: Failed loading|ERROR: Failed to load|ERROR: Cannot open' godot_smoke.log; then exit 1; fi
      - name: Native save file round trip and recovery
        run: |
          set -euo pipefail
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/native_save_test.gd 2>&1 | tee godot_save.log
          grep -q 'NATIVE SAVE TEST PASS' godot_save.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|NATIVE SAVE TEST FAIL' godot_save.log; then exit 1; fi
      - name: Preserve Godot diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: everbloom-source-and-native-${{ github.sha }}
          path: |
            godot_import.log
            godot_smoke.log
            godot_save.log
          if-no-files-found: ignore
          retention-days: 14
