name: Everbloom original world art native acceptance
on:
  push:
    paths:
      - 'scripts/valley.gd'
      - 'scripts/world_art_acceptance.gd'
      - '.github/workflows/everbloom-world-art-acceptance.yml'
permissions:
  contents: read
jobs:
  world-art-native:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Download checksum-pinned official Godot 4.7.2
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/godot.zip' | sha256sum --check
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.7.2-stable_linux.x86_64
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --version
      - name: Native editor import and GDScript parse
        run: |
          set -euo pipefail
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --editor --import --quit 2>&1 | tee world_art_import.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|ERROR: Failed loading|ERROR: Failed to load|ERROR: Cannot open' world_art_import.log; then exit 1; fi
      - name: Native seasonal meadow and multi-year forage acceptance
        run: |
          set -euo pipefail
          timeout 60s /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://scripts/world_art_acceptance.gd 2>&1 | tee world_art_acceptance.log
          grep -q 'EVERBLOOM WORLD ART NATIVE ACCEPTANCE:' world_art_acceptance.log
          grep -q '0 failures' world_art_acceptance.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|ERROR: Failed loading|ERROR: Failed to load|ERROR: Cannot open|WORLD ART ACCEPTANCE FAILED:' world_art_acceptance.log; then exit 1; fi
      - name: Archive exact-commit diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: everbloom-world-art-native-${{ github.sha }}
          path: |
            world_art_import.log
            world_art_acceptance.log
          if-no-files-found: ignore
          retention-days: 14
