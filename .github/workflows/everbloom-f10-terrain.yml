name: Everbloom F10 finite terrain zoning native acceptance
on:
  push:
    branches:
      - 'game/everbloom-farming-f10-terrain-zoning-20261102'
    paths:
      - 'scripts/farm_terrain_zoning.gd'
      - 'scripts/farm_terrain_acceptance.gd'
      - 'docs/FARM_F10_TERRAIN_ZONING.md'
      - '.github/workflows/everbloom-f10-terrain.yml'
permissions:
  contents: read
jobs:
  terrain-native:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Download checksum-pinned official Godot 4.7.2
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/godot.zip' | sha256sum --check
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.7.2-stable_linux.x86_64
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --version
      - name: Native Godot import and script parse
        run: |
          set -euo pipefail
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --editor --import --quit 2>&1 | tee f10_import.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|ERROR: Failed loading|ERROR: Failed to load|ERROR: Cannot open' f10_import.log; then exit 1; fi
      - name: Native two-year terrain and hostile-save acceptance
        run: |
          set -euo pipefail
          timeout 90s /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://scripts/farm_terrain_acceptance.gd 2>&1 | tee f10_acceptance.log
          grep -Eq '^EVERBLOOM F10 TERRAIN NATIVE: [0-9]+ assertions, 0 failures$' f10_acceptance.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|F10 TERRAIN FAILED:|ERROR: Failed loading|ERROR: Failed to load|ERROR: Cannot open' f10_acceptance.log; then exit 1; fi
      - name: Preserve exact-commit native diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: everbloom-f10-terrain-${{ github.sha }}
          path: |
            f10_import.log
            f10_acceptance.log
          if-no-files-found: ignore
          retention-days: 14
